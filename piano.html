<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100b"><title>Piano · Tactical</title><link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials"><link rel="icon" href="./tactical.svg"><link rel="stylesheet" href="./piano.css?v=1"><script type="module" src="./piano.js?v=1"></script><script defer src="./pwa-register.js?v=35"></script></head>
<body><main id="piano"><header><a href="./depth-experimental.html?v=3">‹ Experimental</a><h1>TACTICAL <span>PIANO</span></h1><button id="fullscreen" type="button">Full screen</button></header>

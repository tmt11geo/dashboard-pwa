<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Depth TFJS WebGL benchmark</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem;background:#101820;color:#e6edf3}button{padding:.7rem;margin:.3rem}textarea{box-sizing:border-box;width:100%;height:65vh;background:#050a0f;color:#d3eadb}p{line-height:1.5}</style>
<h1>Depth TFJS WebGL benchmark</h1>
<p>Fixed 224 px model, one validated local image. First inference and three warm
inferences include output readback. SwiftShader measures software compatibility.
No camera or uploads. Cancel terminates the worker and its WebGL context.</p>
<button id="run">Run benchmark</button><button id="cancel" disabled>Cancel</button>
<button id="copy">Copy logs</button><button id="download">Download report</button>
<p id="status" role="status">Ready</p><textarea id="logs" readonly aria-label="Benchmark logs"></textarea>
<script src="controller.js"></script>
</html>
